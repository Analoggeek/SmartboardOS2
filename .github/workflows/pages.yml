name: Deploy SmartBoardOS web app

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/pages.yml
      - index.html
      - install.html
      - manifest.webmanifest
      - sw.js
      - assets/**
      - css/**
      - js/**
      - vendor/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smartboardos-pages
  cancel-in-progress: true

jobs:
  stage:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage the offline web app only
        run: |
          mkdir site
          cp index.html install.html manifest.webmanifest sw.js site/
          cp -R assets css js vendor site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: stage
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Wait for the uploaded Pages artifact to be indexed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..12}; do
            if [[ $(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=github-pages" --jq '[.artifacts[] | select(.name=="github-pages" and .expired==false)] | length') == 1 ]]; then
              exit 0
            fi
            sleep 5
          done
          echo '::error::The uploaded Pages artifact was not indexed in time.'
          exit 1
      - uses: actions/deploy-pages@v4
        id: deployment
