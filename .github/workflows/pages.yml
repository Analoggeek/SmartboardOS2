name: Deploy SmartBoardOS web app

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/pages.yml
      - index.html
      - manifest.webmanifest
      - sw.js
      - assets/**
      - css/**
      - js/**
      - vendor/**
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: smartboardos-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stage the offline web app only
        run: |
          mkdir site
          cp index.html manifest.webmanifest sw.js site/
          cp -R assets css js vendor site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment
