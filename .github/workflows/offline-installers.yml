name: Offline desktop installers

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-installers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    needs: validate
    # Package on main; PRs run validation without publishing or uploading release files.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            platform: win
            arch: x64
            extension: exe
          - runner: windows-2022
            platform: win
            arch: arm64
            extension: exe
          - runner: macos-15-intel
            platform: mac
            arch: x64
            extension: dmg
          - runner: macos-15
            platform: mac
            arch: arm64
            extension: dmg
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Stamp installer version
        run: npm version "1.4.${{ github.run_number }}" --no-git-tag-version --allow-same-version
      - name: Build bundled installer
        run: npm run dist:${{ matrix.platform }} -- --${{ matrix.arch }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/*.${{ matrix.extension }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: release
          merge-multiple: true
      - name: Publish all installers together
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="1.4.${GITHUB_RUN_NUMBER}"
          tag="desktop-v${version}"
          cd release
          # Refuse to promote a superseded run or a release with incomplete artifacts.
          if [[ "$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')" != "$GITHUB_SHA" ]]; then
            echo 'A newer commit is already on main; skipping this release.'
            exit 0
          fi
          assets=("SmartBoardOS-$version-win-x64.exe" "SmartBoardOS-$version-win-arm64.exe" \
                  "SmartBoardOS-$version-mac-x64.dmg" "SmartBoardOS-$version-mac-arm64.dmg")
          for asset in "${assets[@]}"; do test -s "$asset"; done
          sha256sum "${assets[@]}" > SHA256SUMS.txt
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --draft --title "SmartBoardOS $version" --generate-notes
          fi
          if [[ "$(gh release view "$tag" --json isDraft --jq '.isDraft')" == true ]]; then
            gh release upload "$tag" "${assets[@]}" SHA256SUMS.txt --clobber
            gh release edit "$tag" --draft=false --latest
          else
            echo 'This run has already published its release.'
          fi
