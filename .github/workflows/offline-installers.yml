name: Offline desktop installers

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-installers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  android:
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check preinstalled Android SDK
        run: |
          test -r "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
      - name: Build and verify test APK
        env:
          SBOS_VERSION: 1.4.${{ github.run_number }}
          SBOS_VERSION_CODE: ${{ github.run_number }}
        run: bash scripts/build-android.sh qa
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Smoke test the bundled app in Airplane Mode
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-boot-timeout: 450
          script: bash scripts/smoke-android.sh
      - name: Publish QA artifact to the workflow only
        if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main' || vars.SBOS_ANDROID_SIGNING != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: android-qa-build-not-for-distribution
          path: dist/*-android-QA.apk
          if-no-files-found: error
          retention-days: 14
      - name: Sign and verify the Android release
        if: github.ref == 'refs/heads/main' && vars.SBOS_ANDROID_SIGNING == 'true'
        env:
          SBOS_VERSION: 1.4.${{ github.run_number }}
          SBOS_VERSION_CODE: ${{ github.run_number }}
          SBOS_ANDROID_KEYSTORE_B64: ${{ secrets.SBOS_ANDROID_KEYSTORE_B64 }}
          SBOS_ANDROID_KEY_ALIAS: ${{ vars.SBOS_ANDROID_KEY_ALIAS }}
          SBOS_ANDROID_STORE_PASSWORD: ${{ secrets.SBOS_ANDROID_STORE_PASSWORD }}
          SBOS_ANDROID_KEY_PASSWORD: ${{ secrets.SBOS_ANDROID_KEY_PASSWORD }}
          SBOS_ANDROID_CERT_SHA256: ${{ vars.SBOS_ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail
          : "${SBOS_ANDROID_KEYSTORE_B64:?Missing Android release keystore}"
          umask 077
          export SBOS_ANDROID_KEYSTORE="$(mktemp)"
          trap 'rm -f "$SBOS_ANDROID_KEYSTORE"' EXIT
          printf %s "$SBOS_ANDROID_KEYSTORE_B64" | base64 --decode > "$SBOS_ANDROID_KEYSTORE"
          bash scripts/build-android.sh release
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main' && vars.SBOS_ANDROID_SIGNING == 'true'
        with:
          name: installer-android-universal
          path: dist/*-android-universal.apk
          if-no-files-found: error
  build:
    needs: validate
    # Package on main; PRs run validation without publishing or uploading release files.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            platform: win
            arch: x64
            extension: exe
          - runner: windows-2022
            platform: win
            arch: arm64
            extension: exe
          - runner: macos-15-intel
            platform: mac
            arch: x64
            extension: dmg
          - runner: macos-15
            platform: mac
            arch: arm64
            extension: dmg
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Stamp installer version
        run: npm version "1.4.${{ github.run_number }}" --no-git-tag-version --allow-same-version
      - name: Build bundled installer without publisher signing
        if: (matrix.platform == 'win' && vars.SBOS_WIN_SIGNING != 'true') || (matrix.platform == 'mac' && vars.SBOS_MAC_SIGNING != 'true')
        run: npm run dist:${{ matrix.platform }} -- --${{ matrix.arch }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Build, sign and verify Windows installer
        if: matrix.platform == 'win' && vars.SBOS_WIN_SIGNING == 'true'
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          SBOS_WIN_PUBLISHER: ${{ vars.SBOS_WIN_PUBLISHER }}
          SBOS_WIN_ENDPOINT: ${{ vars.SBOS_WIN_ENDPOINT }}
          SBOS_WIN_ACCOUNT: ${{ vars.SBOS_WIN_ACCOUNT }}
          SBOS_WIN_PROFILE: ${{ vars.SBOS_WIN_PROFILE }}
          SBOS_ARCH: ${{ matrix.arch }}
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($name in @('AZURE_CLIENT_ID','AZURE_TENANT_ID','AZURE_CLIENT_SECRET','SBOS_WIN_PUBLISHER','SBOS_WIN_ENDPOINT','SBOS_WIN_ACCOUNT','SBOS_WIN_PROFILE')) {
            if (![System.Environment]::GetEnvironmentVariable($name)) { throw "Missing signing configuration: $name" }
          }
          npm run dist:win -- "--$env:SBOS_ARCH" --config.forceCodeSigning=true "--config.win.azureSignOptions.endpoint=$env:SBOS_WIN_ENDPOINT" "--config.win.azureSignOptions.publisherName=$env:SBOS_WIN_PUBLISHER" "--config.win.azureSignOptions.codeSigningAccountName=$env:SBOS_WIN_ACCOUNT" "--config.win.azureSignOptions.certificateProfileName=$env:SBOS_WIN_PROFILE"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/verify-windows.ps1 "1.4.$env:GITHUB_RUN_NUMBER" "$env:SBOS_ARCH"
      - name: Build, sign and notarize Mac app and disk image
        if: matrix.platform == 'mac' && vars.SBOS_MAC_SIGNING == 'true'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.SBOS_MAC_CERT_P12_B64 }}
          CSC_KEY_PASSWORD: ${{ secrets.SBOS_MAC_CERT_PASSWORD }}
          SBOS_MAC_TEAM_ID: ${{ vars.SBOS_MAC_TEAM_ID }}
          APPLE_API_KEY_B64: ${{ secrets.SBOS_APPLE_API_KEY_B64 }}
          APPLE_API_KEY_ID: ${{ secrets.SBOS_APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.SBOS_APPLE_API_ISSUER }}
          SBOS_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          : "${CSC_LINK:?Missing Developer ID Application certificate}" "${CSC_KEY_PASSWORD:?Missing certificate password}"
          : "${APPLE_API_KEY_B64:?Missing App Store Connect key}" "${APPLE_API_KEY_ID:?Missing key ID}" "${APPLE_API_ISSUER:?Missing key issuer}" "${SBOS_MAC_TEAM_ID:?Missing Apple team ID}"
          umask 077
          key_dir="$(mktemp -d)"
          trap 'rm -rf "$key_dir"' EXIT
          export APPLE_API_KEY="$key_dir/AuthKey_$APPLE_API_KEY_ID.p8"
          printf %s "$APPLE_API_KEY_B64" | base64 -D > "$APPLE_API_KEY"
          npm run dist:mac -- "--$SBOS_ARCH" --config.forceCodeSigning=true --config.mac.identity='Developer ID Application' --config.mac.hardenedRuntime=true --config.mac.notarize=true --config.dmg.sign=true
          bash scripts/verify-mac.sh "1.4.$GITHUB_RUN_NUMBER" "$SBOS_ARCH"
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/*.${{ matrix.extension }}
          if-no-files-found: error

  publish:
    needs: [build, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: release
          merge-multiple: true
      - name: Publish all installers together
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          WIN_SIGNING: ${{ vars.SBOS_WIN_SIGNING }}
          MAC_SIGNING: ${{ vars.SBOS_MAC_SIGNING }}
          ANDROID_SIGNING: ${{ vars.SBOS_ANDROID_SIGNING }}
        run: |
          set -euo pipefail
          version="1.4.${GITHUB_RUN_NUMBER}"
          tag="desktop-v${version}"
          cd release
          # Refuse to promote a superseded run or a release with incomplete artifacts.
          if [[ "$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')" != "$GITHUB_SHA" ]]; then
            echo 'A newer commit is already on main; skipping this release.'
            exit 0
          fi
          assets=("SmartBoardOS-$version-win-x64.exe" "SmartBoardOS-$version-win-arm64.exe" \
                  "SmartBoardOS-$version-mac-x64.dmg" "SmartBoardOS-$version-mac-arm64.dmg")
          if [[ "$ANDROID_SIGNING" == true ]]; then assets+=("SmartBoardOS-$version-android-universal.apk"); fi
          for asset in "${assets[@]}"; do test -s "$asset"; done
          sha256sum "${assets[@]}" > SHA256SUMS.txt
          if ! gh release view "$tag" >/dev/null 2>&1; then
            win='Not publisher signed. Windows may show security warnings or block this installer.'
            mac='Ad-hoc app signature only; not Apple-notarized. Gatekeeper may block this installer.'
            android='No production APK for this release. Use the installable Android web app.'
            [[ "$WIN_SIGNING" != true ]] || win='Installer and app passed timestamped Authenticode and publisher verification.'
            [[ "$MAC_SIGNING" != true ]] || mac='Developer ID signed; the app and disk image passed notarization/staple verification.'
            [[ "$ANDROID_SIGNING" != true ]] || android='APK signature verified against the production certificate fingerprint.'
            notes=$'## Installer verification\n\n'
            notes+="- Windows: $win"$'\n'
            notes+="- Mac: $mac"$'\n'
            notes+="- Android: $android"$'\n'
            notes+='- SHA256SUMS.txt checks file integrity. It does not substitute for publisher signing.'
            gh release create "$tag" --target "$GITHUB_SHA" --draft --title "SmartBoardOS $version" --generate-notes --notes "$notes"
          fi
          if [[ "$(gh release view "$tag" --json isDraft --jq '.isDraft')" == true ]]; then
            gh release upload "$tag" "${assets[@]}" SHA256SUMS.txt --clobber
            gh release edit "$tag" --draft=false --latest
          else
            echo 'This run has already published its release.'
          fi
