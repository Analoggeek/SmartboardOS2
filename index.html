<!DOCTYPE html>
<html lang="en" data-theme="dark" data-accent="indigo">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>SmartBoardOS — The Teacher's Interactive Board</title>
<meta name="description" content="An offline classroom workspace with a pressure-sensitive whiteboard, in-board documents, lesson notes and class tools." />
<meta name="theme-color" content="#0b1020" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="SmartBoardOS" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="icon" href="./assets/icons/favicon-64.png" sizes="64x64" />
<link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon.png" />
<link rel="stylesheet" href="./css/styles.css" />
</head>
<body>

<!-- ───────────────────────── Boot ───────────────────────── -->
<div id="boot" class="boot" role="status" aria-live="polite">
  <div class="boot-inner">
    <div class="boot-logo">
      <img src="./assets/icons/icon-192.png" alt="SmartBoardOS" width="92" height="92" />
      <div class="boot-ring"></div>
    </div>
    <h1 class="boot-title">SmartBoard<span>OS</span></h1>
    <p class="boot-sub">Interactive board for modern classrooms</p>
    <div class="boot-bar"><i id="boot-fill"></i></div>
    <div class="boot-status" id="boot-status">Starting system…</div>
  </div>
</div>

<!-- ───────────────────────── OS shell ───────────────────────── -->
<div id="os" class="os" aria-hidden="true">

  <main id="desktop" class="desktop">
    <div class="desk-scroll workspace-home">
      <section class="workspace-welcome">
        <div><p class="workspace-kicker" id="hero-day">OFFLINE TEACHING WORKSPACE</p>
        <h1 id="hero-greet">Welcome, Teacher</h1>
        <p>Open your board, import a lesson, or choose a classroom tool.</p></div>
        <div class="hero-actions" id="hero-actions"></div>
      </section>
      <section class="workspace-library" aria-label="Classroom apps">
        <h2>Classroom apps</h2><div class="launch-grid" id="launch-grid"></div>
      </section>
    </div>
    <div id="window-layer" class="window-layer"></div>
  </main>
  <header class="workspace-controls" aria-label="Workspace controls">
    <button class="workspace-apps" id="btn-apps" type="button" aria-expanded="false" aria-controls="workspace-menu">
      <img src="./assets/icons/icon-192.png" alt="" width="27" height="27" /><span>Apps</span><span data-icon="chevron-down" aria-hidden="true"></span>
    </button>
    <button class="workspace-view" id="btn-fullscreen" title="Toggle screen fullscreen (F)" aria-label="Toggle screen fullscreen"><span data-icon="fullscreen"></span></button>
  </header>
  <aside class="workspace-menu" id="workspace-menu" aria-label="App launcher" hidden>
    <div class="workspace-menu-head"><div><strong>SmartBoardOS</strong><small>Classroom workspace</small></div><button class="btn" id="btn-home">Home</button></div>
    <div id="workspace-grid" class="workspace-grid"></div>
    <div class="workspace-menu-foot">
      <button class="btn" id="btn-customize" aria-expanded="false">Customize</button>
      <button class="btn" id="btn-cmd">Search</button>
      <button class="btn" id="btn-theme" aria-label="Toggle theme"><span data-icon="moon"></span></button>
      <button class="btn" id="btn-install" hidden>Install web app</button>
    </div>
    <div id="workspace-custom" hidden></div>
  </aside>
</div>

<!-- Command palette -->
<div class="palette-backdrop" id="palette-backdrop" hidden>
  <div class="palette" role="dialog" aria-modal="true" aria-label="Command palette">
    <div class="palette-input-wrap">
      <span class="ic" data-icon="search"></span>
      <input id="palette-input" type="text" placeholder="Search apps, actions, PDFs…" autocomplete="off" spellcheck="false" />
      <kbd>Esc</kbd>
    </div>
    <div class="palette-results" id="palette-results"></div>
    <div class="palette-foot">
      <span><kbd>↑</kbd><kbd>↓</kbd> navigate</span>
      <span><kbd>↵</kbd> open</span>
      <span><kbd>Esc</kbd> close</span>
    </div>
  </div>
</div>

<div id="toasts" class="toasts" aria-live="polite"></div>
<div id="sr-live" class="sr-only" aria-live="polite"></div>

<!-- Vendored libraries (work offline) -->
<script src="./vendor/pdf.min.js"></script>
<script src="./vendor/jspdf/jspdf.umd.min.js"></script>
<script type="module" src="./js/main.js"></script>
</body>
</html>
